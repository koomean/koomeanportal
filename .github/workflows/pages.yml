name: Publish verified Koo Mean Portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Prepare browser for regression checks
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            printf 'PORTAL_CHROME_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:browser
      - name: Prepare WebKit for iPad and iPhone motion checks
        timeout-minutes: 5
        run: npx playwright install --with-deps webkit
      - run: npm run test:webkit
      - name: Verify Portal content and domain
        run: node scripts/verify-portal.mjs
      - name: Package only website files
        run: |
          mkdir _site
          cp index.html 404.html CNAME _site/
          cp -R apps favorites account settings help admin _site/
          cp -R assets _site/assets
          cp -R licenses _site/licenses
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Portal artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
