<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koomean — Link Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1b2b;
    --panel: #16273b;
    --panel-hover: #1c3049;
    --grid-line: rgba(141, 160, 181, 0.10);
    --border: rgba(141, 160, 181, 0.20);
    --border-hover: rgba(232, 163, 61, 0.55);
    --text-primary: #e8edf2;
    --text-secondary: #8da0b5;
    --text-tertiary: #5d7085;
    --accent: #e8a33d;
    --accent-soft: rgba(232, 163, 61, 0.12);
    --error: #e8746b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background-color: var(--bg);
    background-image:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 48px);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .page {
    max-width: 620px;
    margin: 0 auto;
    padding: 96px 24px 64px;
  }

  .masthead {
    margin-bottom: 56px;
  }

  .masthead .kicker {
    display: inline-block;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }

  .masthead .kicker::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .masthead h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(36px, 7vw, 52px);
    line-height: 1.05;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  .masthead p {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin: 0;
    max-width: 46ch;
  }

  .board {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    overflow: hidden;
  }

  .board.scanning::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -20%;
    height: 40%;
    background: linear-gradient(180deg, transparent, rgba(232, 163, 61, 0.10), transparent);
    animation: scan 1.1s ease-out 1;
    pointer-events: none;
  }

  @keyframes scan {
    from { transform: translateY(0%); opacity: 1; }
    to   { transform: translateY(280%); opacity: 0; }
  }

  .row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    border-bottom: 1px solid var(--border);
    transition: background-color 0.15s ease, border-color 0.15s ease, padding-left 0.15s ease;
  }

  .row:last-child { border-bottom: none; }

  a.row:hover, a.row:focus-visible {
    background: var(--panel-hover);
    padding-left: 28px;
  }

  a.row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .row .index {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--text-tertiary);
    min-width: 30px;
    flex-shrink: 0;
  }

  .row .body {
    flex: 1;
    min-width: 0;
  }

  .row .label {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row .note {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: var(--text-tertiary);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s ease, transform 0.15s ease, color 0.15s ease;
  }

  a.row:hover .chevron, a.row:focus-visible .chevron {
    opacity: 1;
    transform: translateX(0);
    color: var(--accent);
  }

  .state {
    padding: 40px 22px;
    text-align: center;
  }

  .state p {
    margin: 0 0 16px;
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.6;
  }

  .state.is-error p { color: var(--error); }

  .pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 10px;
    animation: pulse 1.4s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .btn:hover, .btn:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  footer {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-tertiary);
  }

  @media (prefers-reduced-motion: reduce) {
    .board.scanning::after { animation: none; display: none; }
    .pulse { animation: none; }
  }

  @media (max-width: 480px) {
    .page { padding: 64px 18px 48px; }
    .row { padding: 16px 18px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="masthead">
    <span class="kicker">signal board</span>
    <h1>Koomean</h1>
    <p>ลิงก์โปรเจกต์ บล็อก และช่องทางอื่นๆ ของผม อัปเดตจาก Google Sheet โดยตรง</p>
  </div>

  <div class="board" id="board">
    <div class="state">
      <p><span class="pulse"></span>syncing link board…</p>
    </div>
  </div>

  <footer>
    <span id="statusLine"></span>
    <button class="btn" id="reloadBtn" style="display:none;">reload</button>
  </footer>
</div>

<script>
  // วางลิงก์ CSV ที่ได้จากการ Publish to web ของ Google Sheet ตรงนี้
  const SHEET_CSV_URL = "PASTE_YOUR_PUBLISHED_CSV_LINK_HERE";

  const board = document.getElementById('board');
  const statusLine = document.getElementById('statusLine');
  const reloadBtn = document.getElementById('reloadBtn');

  reloadBtn.addEventListener('click', loadLinks);

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const next = text[i + 1];

      if (inQuotes) {
        if (char === '"' && next === '"') { field += '"'; i++; }
        else if (char === '"') { inQuotes = false; }
        else { field += char; }
      } else {
        if (char === '"') inQuotes = true;
        else if (char === ',') { row.push(field); field = ''; }
        else if (char === '\n' || char === '\r') {
          if (char === '\r' && next === '\n') i++;
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
        } else { field += char; }
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  function renderRows(rawRows) {
    if (rawRows.length < 2) { renderEmpty(); return; }

    const header = rawRows[0].map(h => h.trim().toLowerCase());
    const idxLabel = header.indexOf('label');
    const idxUrl = header.indexOf('url');
    const idxNote = header.indexOf('note');

    if (idxLabel === -1 || idxUrl === -1) { renderError('sheet ยังไม่มีคอลัมน์ "Label" กับ "URL" — เพิ่มหัวตารางให้ตรงแล้วลอง reload'); return; }

    const links = rawRows.slice(1)
      .map(r => ({
        label: (r[idxLabel] || '').trim(),
        url: (r[idxUrl] || '').trim(),
        note: idxNote > -1 ? (r[idxNote] || '').trim() : ''
      }))
      .filter(r => r.url);

    if (links.length === 0) { renderEmpty(); return; }

    board.innerHTML = links.map((link, i) => `
      <a class="row" href="${escapeAttr(link.url)}" target="_blank" rel="noopener">
        <span class="index">${String(i + 1).padStart(2, '0')}</span>
        <span class="body">
          <span class="label">${escapeHtml(link.label || link.url)}</span>
          ${link.note ? `<span class="note">${escapeHtml(link.note)}</span>` : ''}
        </span>
        <svg class="chevron" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    `).join('');

    board.classList.add('scanning');
    statusLine.textContent = `${links.length} ลิงก์ · sync ล่าสุด ${new Date().toLocaleTimeString('th-TH')}`;
    reloadBtn.style.display = 'inline-block';
  }

  function renderEmpty() {
    board.innerHTML = `<div class="state"><p>ยังไม่มีลิงก์ในชีต — เพิ่มแถวใหม่พร้อมคอลัมน์ Label กับ URL แล้วกด reload</p></div>`;
    reloadBtn.style.display = 'inline-block';
  }

  function renderError(message) {
    board.innerHTML = `<div class="state is-error"><p>${message || 'เชื่อมต่อชีตไม่ได้ — เช็คว่า publish to web แล้ว และลิงก์ CSV ถูกต้อง'}</p></div>`;
    reloadBtn.style.display = 'inline-block';
  }

  async function loadLinks() {
    reloadBtn.style.display = 'none';
    statusLine.textContent = '';
    board.classList.remove('scanning');
    board.innerHTML = `<div class="state"><p><span class="pulse"></span>syncing link board…</p></div>`;

    if (!SHEET_CSV_URL || SHEET_CSV_URL.includes('PASTE_YOUR')) {
      renderError('ยังไม่ได้ใส่ลิงก์ CSV ของ Google Sheet ใน SHEET_CSV_URL');
      return;
    }

    try {
      const sep = SHEET_CSV_URL.includes('?') ? '&' : '?';
      const res = await fetch(SHEET_CSV_URL + sep + 'cachebust=' + Date.now());
      if (!res.ok) throw new Error('bad status');
      const text = await res.text();
      renderRows(parseCSV(text));
    } catch (err) {
      renderError();
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return str.replace(/"/g, '&quot;');
  }

  loadLinks();
</script>

</body>
</html>
